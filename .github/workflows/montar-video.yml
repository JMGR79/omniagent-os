# OmniAgent OS · montaje gratuito de vídeos en GitHub Actions.
# n8n (GEN-02) lanza este flujo con el trabajo de montaje y la URL de reanudación de su ejecución;
# aquí se generan las imágenes (Cloudflare), se monta el vídeo con ffmpeg y se devuelve a n8n.
# Secretos del repositorio: CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN y MONTAJE_TOKEN (el mismo valor que en Render).
name: Montar vídeo (OmniAgent)

on:
  workflow_dispatch:
    inputs:
      trabajo:
        description: Trabajo de montaje (JSON en base64)
        required: true
      respuesta:
        description: URL de n8n donde se entrega el vídeo
        required: true

permissions:
  contents: write   # para publicar el vídeo como archivo de la release «videos»

jobs:
  montar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/montar.mjs
          sparse-checkout-cone-mode: false

      - name: Comprobar la URL de entrega
        env:
          RESPUESTA: ${{ inputs.respuesta }}
        run: |
          # La URL lleva la firma de n8n: se oculta en el registro público
          echo "::add-mask::$RESPUESTA"
          # Solo se entrega a una URL de reanudación de n8n (…/webhook-waiting/<ejecución>[?signature=…])
          echo "$RESPUESTA" | grep -Eq '^https://[A-Za-z0-9.-]+/webhook-waiting/[0-9]+(\?signature=[A-Za-z0-9._~%-]+)?$' || { echo "URL de entrega no válida"; exit 1; }

      - name: Instalar ffmpeg y la fuente
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null

      - name: Montar el vídeo
        env:
          TRABAJO: ${{ inputs.trabajo }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NOMBRE_NEGOCIO: ${{ vars.NOMBRE_NEGOCIO || 'EstrategIA Digital 3.0' }}
          OMNI_FUENTE: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          OMNI_MONTAJE_SALIDA: ${{ runner.temp }}/video.mp4
        run: node scripts/montar.mjs "$TRABAJO"

      - name: Publicar el vídeo en la release «videos»
        id: publicar
        env:
          GH_TOKEN: ${{ github.token }}
          VIDEO: ${{ runner.temp }}/video.mp4
        run: |
          # El vídeo se guarda en GitHub (público, como cualquier vídeo para redes) y a OmniAgent solo le llega el enlace.
          gh release view videos > /dev/null 2>&1 || gh release create videos --title "Vídeos de OmniAgent" --notes "Vídeos montados automáticamente por OmniAgent."
          NOMBRE="video-${{ github.run_id }}-${{ github.run_attempt }}.mp4"
          cp "$VIDEO" "${{ runner.temp }}/$NOMBRE"
          gh release upload videos "${{ runner.temp }}/$NOMBRE" --clobber
          echo "url=https://github.com/${{ github.repository }}/releases/download/videos/$NOMBRE" >> "$GITHUB_OUTPUT"

      - name: Entregar el enlace a OmniAgent
        env:
          RESPUESTA: ${{ inputs.respuesta }}
          MONTAJE_TOKEN: ${{ secrets.MONTAJE_TOKEN }}
          URL_VIDEO: ${{ steps.publicar.outputs.url }}
        run: |
          node -e "console.log(JSON.stringify({token:process.env.MONTAJE_TOKEN,url:process.env.URL_VIDEO}))" \
            | curl -sS --fail --max-time 60 -X POST -H 'content-type: application/json' --data-binary @- "$RESPUESTA" > /dev/null
          echo "Vídeo entregado: $URL_VIDEO"

      - name: Avisar a OmniAgent del fallo
        if: failure()
        env:
          RESPUESTA: ${{ inputs.respuesta }}
          MONTAJE_TOKEN: ${{ secrets.MONTAJE_TOKEN }}
        run: |
          echo "$RESPUESTA" | grep -Eq '^https://[A-Za-z0-9.-]+/webhook-waiting/[0-9]+(\?signature=[A-Za-z0-9._~%-]+)?$' || exit 0
          node -e "console.log(JSON.stringify({token:process.env.MONTAJE_TOKEN,error:'El montaje falló en GitHub Actions; revisa el registro del flujo «Montar vídeo».'}))" \
            | curl -sS --max-time 60 -X POST -H 'content-type: application/json' --data-binary @- "$RESPUESTA" > /dev/null || true
